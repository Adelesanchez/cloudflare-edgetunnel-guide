<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Pages 部署流程</title>
  <desc id="desc">自定义域名连接 Cloudflare Pages，Pages 运行 EdgeTunnel 并连接 KV，客户端通过订阅使用服务。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#f8fafc"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g>
      <rect x="55" y="95" width="220" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="165" y="140" font-size="25" font-weight="600" fill="#0f172a">自定义域名</text>
      <text x="165" y="175" font-size="18" fill="#475569">DNS / CNAME</text>
    </g>
    <g>
      <rect x="365" y="95" width="220" height="110" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
      <text x="475" y="140" font-size="25" font-weight="600" fill="#0f172a">Cloudflare Pages</text>
      <text x="475" y="175" font-size="18" fill="#475569">运行 EdgeTunnel</text>
    </g>
    <g>
      <rect x="675" y="30" width="220" height="100" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="785" y="75" font-size="25" font-weight="600" fill="#0f172a">Workers KV</text>
      <text x="785" y="105" font-size="18" fill="#475569">保存配置</text>
    </g>
    <g>
      <rect x="675" y="190" width="220" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="785" y="235" font-size="25" font-weight="600" fill="#0f172a">管理后台</text>
      <text x="785" y="265" font-size="18" fill="#475569">生成节点与订阅</text>
    </g>
    <g>
      <rect x="970" y="95" width="190" height="110" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
      <text x="1065" y="140" font-size="25" font-weight="600" fill="#0f172a">代理客户端</text>
      <text x="1065" y="175" font-size="18" fill="#475569">导入节点或订阅</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M275 150 H365"/>
      <path d="M585 125 L675 85"/>
      <path d="M585 175 L675 230"/>
      <path d="M895 240 C940 240 940 150 970 150"/>
    </g>
  </g>
</svg>
